plugins {
    id 'com.android.application'
}

android {
    namespace 'tech.valleautomotores.crm'
    compileSdk 35

    defaultConfig {
        applicationId 'tech.valleautomotores.crm'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '1.0.0'
        resValue 'string', 'crm_base_url', 'https://crm.valleautomotores.tech'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
        debug {
            applicationIdSuffix ''
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packaging {
        resources {
            excludes += ['/META-INF/{AL2.0,LGPL2.1}']
        }
    }
}

dependencies {
    implementation 'androidx.core:core:1.16.0'
    implementation 'androidx.work:work-runtime:2.10.1'
}
