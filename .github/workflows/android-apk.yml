name: Compilar APK Valle Automotores

on:
  push:
    branches:
      - feature/android-crm-app-20261122
      - main
    paths:
      - 'android-app/**'
      - '.github/workflows/android-apk.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'android-app/**'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-apk:
    name: Compilar APK Android
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar plataforma Android 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Compilar y firmar APK de prueba
        run: gradle -p android-app :app:assembleDebug --no-daemon --stacktrace

      - name: Calcular SHA256
        run: |
          cd android-app/app/build/outputs/apk/debug
          sha256sum app-debug.apk > app-debug.apk.sha256
          ls -lh app-debug.apk

      - name: Publicar APK instalable
        uses: actions/upload-artifact@v4
        with:
          name: Valle-Automotores-CRM-APK
          path: |
            android-app/app/build/outputs/apk/debug/app-debug.apk
            android-app/app/build/outputs/apk/debug/app-debug.apk.sha256
          if-no-files-found: error
          retention-days: 30
