name: Pruebas dominio CRM
on:
  push:
    branches: [pruebas-valle-20261120]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  diagnostico:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Resolver dominios
        run: |
          for host in wacrm-pruebas-crm.ytg5fs.easypanel.host wacrm-pruebas-wacrm-app.ytg5fs.easypanel.host wacrm.ytg5fs.easypanel.host; do
            echo "=== $host ==="
            dig +short "$host" A || true
            curl -L --silent --show-error --max-time 12 --output /dev/null --write-out "http_code=%{http_code} remote_ip=%{remote_ip} ssl_verify=%{ssl_verify_result} redirect=%{redirect_url}\n" "https://$host/" || true
          done
      - name: Endpoint público independiente
        run: |
          curl -L --silent --show-error --max-time 12 --output /dev/null --write-out "google_http=%{http_code}\n" "https://www.google.com" || true
